[build-systems]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.3.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.33.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "supabase>=2.31.0",
    "uvicorn>=0.52.4",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "2026-08-25T00:00:00Z"

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "pytest==9.1.1",
    "ruff==0.16.4",
]
